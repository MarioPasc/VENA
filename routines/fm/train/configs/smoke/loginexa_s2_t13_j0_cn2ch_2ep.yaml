# Loginexa 2-epoch smoke — S2 T-13 J0: 2-ch [TC,NETC] ControlNet, frozen trunk.
#
# Mirrors routines/fm/train/configs/runs/picasso_s2_t13_j0_v3a_cn2ch_freeze_fft.yaml
# under loginexa constraints (1× V100-DGXS-32GB, 30-min hard wallclock).
#
# Smoke-only differences:
#   * max_epochs=2 + total_steps=400 (total_steps binds PL max_steps; > 2-epoch
#     step count so max_epochs binds first).
#   * warmup_steps=40 (was 1000) — cosine decay completes inside the smoke.
#   * max_train_patients_per_cohort=10 caps each CV cohort.
#   * batch_size=2 (V100 32 GB headroom) — MUST be ≥ 2 so the multi-cohort
#     collation path (which failed in prod with batch_size=1) is exercised.
#   * grad_accum=1 for speed.
#   * exhaustive_val every epoch, n_patients=3, NFE [1,5], block_until_complete=true,
#     device=cuda:0 (loginexa is single-V100).
#
# data.use_offline_augmented_data: false — mandatory: the offline-aug H5s lack
# masks/tumor_latent_soft and would raise MissingSoftMaskGroupError at item load.
#
# ≥ 2 cohorts served by default via corpus_picasso.json + max_train_patients_per_cohort=10.
#
# Run (on loginexa via SSH ProxyJump):
#   vena-v100/bin/python -m routines.fm.train.cli \
#     routines/fm/train/configs/smoke/loginexa_s2_t13_j0_cn2ch_2ep.yaml

run:
  stage: s1
  tag: s2_t13_smoke_cn2ch
  # WARM_START from the real v3a ema_best.ckpt — deliberately NOT null.
  # Every production arm warm-starts from this file, and warm-start is exactly
  # where a fresh 2-ch ControlNet on a 16-ch-conv_in trunk would blow up on a
  # shape mismatch. A smoke that skips it cannot catch that class of failure —
  # the same blind spot that killed both S5 arrays in 90 s.
  # Read-only, weights-only (fresh optimiser/EMA/RNG); nothing is written here.
  resume_from: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/vena_project/2026-06-24_16-00-46_s1_v3a_concat_only_fft_ef000c9f/checkpoints/ema_best.ckpt
  seed: 1337
  device: cuda
  precision: bf16-mixed
  full_determinism: false

data:
  corpus_registry: routines/fm/train/configs/corpus/corpus_picasso.json
  fold: 0
  # batch_size=2: MUST be ≥ 2 (batch_size=1 hides cross-cohort collate failures;
  # see feedback_smoke_must_exercise_failing_path.md).
  batch_size: 2
  num_workers: 4
  pin_memory: true
  tau: 0.5
  max_train_patients_per_cohort: 10
  augmentation_config_path: null
  preflight_decision_path: null
  dedup_decisions_path: /mnt/home/users/tic_163_uma/mpascual/fscratch/artifacts/preflights/cohort_dedup/LATEST/decision.json
  # Offline-aug H5s lack masks/tumor_latent_soft — must stay false with oracle_soft.
  use_offline_augmented_data: false
  mask_source: oracle_soft

model:
  trunk:
    checkpoint: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/NV-Generate-MR/models/diff_unet_3d_rflow-mr.pt
    arch_json: null
    arch_overrides:
      in_channels: 16
    class_token: 9
    spacing_mm: [1.0, 1.0, 1.0]
    trainable: false        # J0 freeze arm
    regime: fft
    input_concat:
      enabled: true
      cond_latents: [t1pre, t2, flair]
      cond_masks: []
      zero_init_new_channels: true
      ramp_steps: 0
      ramp_steepness: 10.0
  controlnet:
    enabled: true
    init_from_trunk: true
    # Two 1-channel specs (A.8-§4): mask-part total_channels == 2.
    conditioning_inputs:
      - mask:tc_soft:identity
      - mask:netc_soft:identity
    arch_overrides: {}
    perturb_keys: []
    output_scale_ramp:
      enabled: true
      ramp_steps: 5000
      steepness: 10.0
  vae_checkpoint: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/NV-Generate-MR/models/autoencoder_v2.pt

loss:
  cfm:
    weight: 1.0
    reduction: mean
    norm: l1

rflow:
  num_train_timesteps: 1000
  use_discrete_timesteps: true
  sample_method: logit-normal
  use_timestep_transform: true
  base_img_size_numel: 129024   # = 48×56×48 (correct; no mismatch)

optim:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-2
  warmup_steps: 40              # smoke-only: was 1000 in production
  scheduler: cosine

ema:
  decay: 0.9999
  update_after_step: 0
  update_every: 1
  inv_gamma: 10.0
  power: 1.0
  min_value: 0.0

training:
  total_steps: 400              # > 2-epoch count so max_epochs binds; cosine horizon
  max_epochs: 2
  batch_size: 2
  grad_accum: 1
  checkpoint_every_epochs: 1
  log_train_every_steps: 10
  best_metric_name: mse_latent
  best_metric_region: bg
  best_metric_nfe: 5
  gradient_clip_val: 1.0
  patience: 100

validation:
  every_epochs: 0
  per_epoch_nfe: 5
  full_sweep_every_epochs: 999999
  sweep_nfes: [1, 2, 5, 10, 20]
  qualitative_every_epochs: 999999
  image_metrics: false

exhaustive_val:
  enabled: true
  every_epochs: 1
  n_patients: 3
  nfe_levels: [1, 5]
  integrator: euler
  corpus_registry: routines/fm/train/configs/corpus/corpus_picasso.json
  device: cuda:0               # loginexa is single-V100; piggyback the train GPU
  block_until_complete: true
  figure_top_k: 2

output:
  experiments_root: /mnt/home/users/tic_163_uma/mpascual/execs/VENA
  retention_n_checkpoints: 3
  tensorboard: false
  wandb: false

regions:
  brain:
    source: latents_h5
  wt:
    source: derived_from_tumor_latent
    threshold: 0.5
  wt_dilated:
    source: derived_via_scipy_binary_dilation
    structure: ones_3x3x3
  bg:
    source: derived
  vessel:
    source: skipped
