# Picasso — S1 v3a A6 input-modality ablation: {T2, FLAIR} (drop T1pre).
#
# A6 ablation (paper §4.7, .claude/notes/article/06_vena_ablations.md T6.6):
# retrains the v3a Variant-A model (channel-concat at trunk, NO ControlNet, NO
# region weighting) on a 2-modality input subset to isolate each input's
# marginal value. This arm drops T1pre from the {T1pre, T2, FLAIR} reference set.
#
# Reference (3-channel) run:
#   routines/fm/train/configs/runs/picasso_s1_v3a_concat_only_fft.yaml
#   /media/.../results/fm/vena/2026-06-24_16-00-46_s1_v3a_concat_only_fft_ef000c9f
#
# Only recipe deltas vs the reference:
#   * model.trunk.input_concat.cond_latents: [t2, flair]     (was [t1pre, t2, flair])
#     ⇒ trunk in_channels = 4 (target) + 2*4 (cond) = 12  (was 16)
#   * model.trunk.arch_overrides.in_channels: 12            — required cross-check
#   * run.tag: v3a_a6_t2_flair_fft                          — recipe-isolated run_id
# Everything else (loss, optim, schedule, exhaustive_val, budget) is byte-identical.
#
# Hardware: 2x A100 40 GB (cuda:0 training, cuda:1 async exhaustive val).
# Walltime: 7 days. EarlyStopping patience=250 epochs on train/total_epoch.
# Effective batch 8 (physical 4, grad_accum 2).
#
# Submit via:
#   sbatch routines/fm/train/slurm/runs/launcher_picasso_s1_v3a_a6_t2_flair.sh

run:
  stage: s1
  tag: v3a_a6_t2_flair_fft
  resume_from: baseline
  seed: 1337
  device: cuda
  precision: bf16-mixed
  full_determinism: false

data:
  corpus_registry: routines/fm/train/configs/corpus/corpus_picasso.json
  fold: 0
  batch_size: 4
  num_workers: 8
  pin_memory: true
  tau: 0.5
  augmentation_config_path: null
  preflight_decision_path: null
  dedup_decisions_path: /mnt/home/users/tic_163_uma/mpascual/fscratch/artifacts/preflights/cohort_dedup/LATEST/decision.json
  use_offline_augmented_data: true
  variant_weights:
    v0: 0.2
    v1: 0.2
    v2: 0.2
    v3: 0.2
    v4: 0.2

model:
  trunk:
    checkpoint: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/NV-Generate-MR/models/diff_unet_3d_rflow-mr.pt
    arch_json: null
    # Trunk in_channels widened from 4 to 12 by ``expand_conv_in`` (post-
    # ``_instantiate_trunk``). The new 8 input channels are zero-initialised
    # so the trunk's step-0 behaviour is bit-identical to the pretrained MAISI
    # baseline on the original 4 channels.
    arch_overrides:
      in_channels: 12
    class_token: 9
    spacing_mm: [1.0, 1.0, 1.0]
    trainable: true
    regime: fft
    # A6 ablation — channel-concat conditioning on {T2, FLAIR} only.
    input_concat:
      enabled: true
      cond_latents: [t2, flair]
      cond_masks: []
      zero_init_new_channels: true
      ramp_steps: 0           # zero-init alone is enough for step-0 correctness
      ramp_steepness: 10.0
  controlnet:
    enabled: false            # Variant A — no ControlNet
    init_from_trunk: true     # ignored when enabled=false
    conditioning_inputs: []
    arch_overrides: {}
    perturb_keys: []
    output_scale_ramp: null   # no ControlNet ⇒ no output scale to ramp
  vae_checkpoint: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/NV-Generate-MR/models/autoencoder_v2.pt

loss:
  cfm:
    weight: 1.0
    # A6 ablation matches the v3a reference exactly: standard L1 mean reduction
    # (Eidex 2025 — ``F.l1_loss(v, (tgt - noise))``). NO region weighting.
    reduction: mean
    norm: l1

rflow:
  num_train_timesteps: 1000
  use_discrete_timesteps: true
  sample_method: logit-normal
  use_timestep_transform: true
  base_img_size_numel: 129024

optim:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-2
  warmup_steps: 1000
  scheduler: cosine

ema:
  decay: 0.9999
  update_after_step: 0
  update_every: 1
  inv_gamma: 10.0
  power: 1.0
  min_value: 0.0

training:
  total_steps: 400000
  max_epochs: 10000
  batch_size: 4
  grad_accum: 2
  checkpoint_every_epochs: 25
  log_train_every_steps: 100
  gradient_clip_val: 1.0
  patience: 250

validation:
  every_epochs: 0
  per_epoch_nfe: 5
  full_sweep_every_epochs: 999999
  sweep_nfes: [1, 2, 5, 10, 20]
  qualitative_every_epochs: 999999
  image_metrics: false

exhaustive_val:
  enabled: true
  every_epochs: 25
  n_patients: 60
  nfe_levels: [1, 2, 5, 10, 20]
  integrator: euler
  corpus_registry: routines/fm/train/configs/corpus/corpus_picasso.json
  device: cuda:1
  block_until_complete: false
  figure_top_k: 5

output:
  experiments_root: /mnt/home/users/tic_163_uma/mpascual/execs/vena/experiments
  retention_n_checkpoints: 3
  tensorboard: false
  wandb: false

regions:
  brain:
    source: latents_h5
  wt:
    source: derived_from_tumor_latent
    threshold: 0.5
  wt_dilated:
    source: derived_via_scipy_binary_dilation
    structure: ones_3x3x3
  bg:
    source: derived
  vessel:
    source: skipped
