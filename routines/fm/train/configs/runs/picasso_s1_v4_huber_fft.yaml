# Picasso — S1 v4 §18 ablation arm C: pseudo-Huber (FFT trunk, concat-only).
#
# Architecture: identical to picasso_s1_v3a_concat_only_fft.yaml (T1pre/T2/FLAIR
# channel-concat at trunk first-conv; NO ControlNet).
#
# §18 three-arm ablation (v3a_retraining.md §18):
#   Arm A: norm=l1               — median-seeking (v3a control)
#   Arm B: norm=l2               — mean-seeking
#   Arm C (this file): norm=huber, delta=0.90  — pseudo-Huber
#
# δ=0.90 is pre-registered from the L1 arm's median absolute velocity residual
# (Song & Dhariwal ICLR 2024 §3). Pseudo-Huber: δ²(√(1+(r/δ)²) − 1).
# Transitions from L2 for |r|<δ to L1 asymptote for |r|>>δ; gradient variance
# lower than L1, less mode-averaging than L2.
#
# Identical to picasso_s1_v4_l1_fft.yaml EXCEPT loss.cfm.norm: huber and
# the addition of loss.cfm.delta: 0.90. See that file for the full §19 changelog.

run:
  stage: s1
  tag: fft_cfm_huber
  resume_from: baseline
  seed: 1337
  device: cuda
  precision: bf16-mixed
  full_determinism: false

data:
  corpus_registry: routines/fm/train/configs/corpus/corpus_picasso.json
  fold: 0
  batch_size: 4
  num_workers: 8
  pin_memory: true
  tau: 0.5
  augmentation_config_path: null
  preflight_decision_path: null
  dedup_decisions_path: /mnt/home/users/tic_163_uma/mpascual/fscratch/artifacts/preflights/cohort_dedup/LATEST/decision.json
  use_offline_augmented_data: true
  variant_weights:
    v0: 0.2
    v1: 0.2
    v2: 0.2
    v3: 0.2
    v4: 0.2

model:
  trunk:
    checkpoint: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/NV-Generate-MR/models/diff_unet_3d_rflow-mr.pt
    arch_json: null
    arch_overrides:
      in_channels: 16
    class_token: 9
    spacing_mm: [1.0, 1.0, 1.0]
    trainable: true
    regime: fft
    input_concat:
      enabled: true
      cond_latents: [t1pre, t2, flair]
      cond_masks: []
      zero_init_new_channels: true
      ramp_steps: 0
      ramp_steepness: 10.0
  controlnet:
    enabled: false
    init_from_trunk: true
    conditioning_inputs: []
    arch_overrides: {}
    perturb_keys: []
    output_scale_ramp: null
  vae_checkpoint: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/NV-Generate-MR/models/autoencoder_v2.pt

loss:
  cfm:
    weight: 1.0
    reduction: mean
    norm: huber
    delta: 0.90

rflow:
  num_train_timesteps: 1000
  use_discrete_timesteps: true
  sample_method: logit-normal
  use_timestep_transform: true
  base_img_size_numel: 129024

optim:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-2
  warmup_steps: 1000
  scheduler: cosine

ema:
  decay: 0.9999
  update_after_step: 0
  update_every: 1
  inv_gamma: 10.0
  power: 1.0
  min_value: 0.0

training:
  total_steps: 800000
  max_epochs: 10000
  batch_size: 4
  grad_accum: 2
  checkpoint_every_epochs: 25
  log_train_every_steps: 100
  gradient_clip_val: 5.0
  patience: 150
  conditioning_dropout_p: 0.1
  conditioning_dropout_keys: ["wt"]

validation:
  every_epochs: 0
  per_epoch_nfe: 5
  full_sweep_every_epochs: 999999
  sweep_nfes: [1, 2, 5, 10, 20]
  qualitative_every_epochs: 999999
  image_metrics: false

exhaustive_val:
  enabled: true
  every_epochs: 25
  n_patients: 60
  nfe_levels: [1, 2, 5, 10, 20]
  integrator: euler
  corpus_registry: routines/fm/train/configs/corpus/corpus_picasso.json
  device: cuda:1
  block_until_complete: false
  figure_top_k: 5
  latent_preds_every_n: 4

output:
  experiments_root: /mnt/home/users/tic_163_uma/mpascual/execs/vena/experiments
  retention_n_checkpoints: 40
  tensorboard: false
  wandb: false

regions:
  brain:
    source: latents_h5
  wt:
    source: derived_from_tumor_latent
    threshold: 0.5
  wt_dilated:
    source: derived_via_scipy_binary_dilation
    structure: ones_3x3x3
  bg:
    source: derived
  vessel:
    source: skipped
