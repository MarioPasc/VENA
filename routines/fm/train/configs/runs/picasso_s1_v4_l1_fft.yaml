# Picasso — S1 v4 §18 ablation arm A: L1 control (FFT trunk, concat-only).
#
# Architecture: identical to picasso_s1_v3a_concat_only_fft.yaml (T1pre/T2/FLAIR
# channel-concat at trunk first-conv; NO ControlNet). This is a RETRAIN of v3a,
# not a new architecture arm.
#
# §18 three-arm ablation (v3a_retraining.md §18):
#   Arm A (this file): norm=l1   — median-seeking (v3a control)
#   Arm B: norm=l2               — mean-seeking
#   Arm C: norm=huber, δ=0.90    — pseudo-Huber (Song & Dhariwal ICLR 2024)
# Arms differ in EXACTLY ONE field (loss.cfm.norm) plus the §19 budget knobs.
#
# §19 knob changes vs picasso_s1_v3a_concat_only_fft.yaml:
#   gradient_clip_val: 1.0 → 5.0  (B3; 9.2× headroom over L1 p95 grad norm)
#   retention_n_checkpoints: 3 → 40  (B5; full history for post-hoc ssim_brain)
#   total_steps: 400000 → 800000  (2× v3a; ~3850 epochs; ~5 A100-days/arm)
#   patience: 250 → 150  (RUNAWAY GUARD ONLY — see §3 correction in spec)
#   conditioning_dropout_p: 0.1  (§18 — enables CFG; no-op in concat-only arch
#     because there is no ControlNet branch to drop out, but kept so the config
#     is forward-compatible with any future ControlNet warm-start)
#   exhaustive_val.latent_preds_every_n: 4  (B12; ~one H5/100 epochs)
#
# NOTE — resume_from: baseline. §18 Trap 1 requires each arm to start from the
# frozen MAISI FM trunk, not from any prior run. Never change to 'latest' without
# recording the decision in §21 of v3a_retraining.md.
#
# Hardware: 2× A100 40 GB (cuda:0 training, cuda:1 async exhaustive val).
# Walltime: ~5 A100-days (800000 steps × ~2.4 s/step / 3600 / 24 ≈ 22 h/arm).
# Post-hoc selection: scripts/select_checkpoint.py --metric ssim_mean
#   --region brain reads aggregate_cv.csv per arm.

run:
  stage: s1
  tag: fft_cfm_l1
  resume_from: baseline
  seed: 1337
  device: cuda
  precision: bf16-mixed
  full_determinism: false

data:
  corpus_registry: routines/fm/train/configs/corpus/corpus_picasso.json
  fold: 0
  batch_size: 4
  num_workers: 8
  pin_memory: true
  tau: 0.5
  augmentation_config_path: null
  preflight_decision_path: null
  dedup_decisions_path: /mnt/home/users/tic_163_uma/mpascual/fscratch/artifacts/preflights/cohort_dedup/LATEST/decision.json
  use_offline_augmented_data: true
  variant_weights:
    v0: 0.2
    v1: 0.2
    v2: 0.2
    v3: 0.2
    v4: 0.2

model:
  trunk:
    checkpoint: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/NV-Generate-MR/models/diff_unet_3d_rflow-mr.pt
    arch_json: null
    arch_overrides:
      in_channels: 16
    class_token: 9
    spacing_mm: [1.0, 1.0, 1.0]
    trainable: true
    regime: fft
    input_concat:
      enabled: true
      cond_latents: [t1pre, t2, flair]
      cond_masks: []
      zero_init_new_channels: true
      ramp_steps: 0
      ramp_steepness: 10.0
  controlnet:
    enabled: false
    init_from_trunk: true
    conditioning_inputs: []
    arch_overrides: {}
    perturb_keys: []
    output_scale_ramp: null
  vae_checkpoint: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/NV-Generate-MR/models/autoencoder_v2.pt

loss:
  cfm:
    weight: 1.0
    reduction: mean
    norm: l1

rflow:
  num_train_timesteps: 1000
  use_discrete_timesteps: true
  sample_method: logit-normal
  use_timestep_transform: true
  base_img_size_numel: 129024

optim:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-2
  warmup_steps: 1000
  scheduler: cosine

ema:
  decay: 0.9999
  update_after_step: 0
  update_every: 1
  inv_gamma: 10.0
  power: 1.0
  min_value: 0.0

training:
  # total_steps is THE binding termination limit (2× v3a; ~3850 epochs; ~5 A100-days).
  # max_epochs is non-binding headroom — total_steps terminates first.
  total_steps: 800000
  max_epochs: 10000
  batch_size: 4
  grad_accum: 2
  checkpoint_every_epochs: 25
  log_train_every_steps: 100
  # B3: raised from 1.0; §18 validity criterion requires grad_clip_active < 5 %
  # past step 5000. Asserted post-training in _assert_grad_clip_validity.
  gradient_clip_val: 5.0
  # patience: 150 is a RUNAWAY GUARD ONLY — not a convergence detector.
  # v3a evidence: train/total_epoch improved monotonically through epoch 1923
  # (minimum at epoch 1862, EarlyStopping never fired; run stopped at total_steps).
  # Under normal monotone-loss convergence this guard will never fire.
  # If it fires, the arm diverged or plateaued — investigate before accepting
  # checkpoints. Checkpoint selection is post-hoc via select_checkpoint.py.
  patience: 150
  # §18 — enables CFG at inference. No-op in concat-only arch (no ControlNet
  # branch to drop), but kept for forward-compatibility.
  conditioning_dropout_p: 0.1
  conditioning_dropout_keys: ["wt"]

validation:
  every_epochs: 0
  per_epoch_nfe: 5
  full_sweep_every_epochs: 999999
  sweep_nfes: [1, 2, 5, 10, 20]
  qualitative_every_epochs: 999999
  image_metrics: false

exhaustive_val:
  enabled: true
  every_epochs: 25
  n_patients: 60
  nfe_levels: [1, 2, 5, 10, 20]
  integrator: euler
  corpus_registry: routines/fm/train/configs/corpus/corpus_picasso.json
  device: cuda:1
  block_until_complete: false
  figure_top_k: 5
  # B12: write latent_preds.h5 only every 4 cadence passes (~every 100 epochs)
  # to avoid filling disk on a ~3850-epoch run (~27 GB total without gating).
  latent_preds_every_n: 4

output:
  experiments_root: /mnt/home/users/tic_163_uma/mpascual/execs/vena/experiments
  # B5: retain 40 checkpoints so post-hoc ssim_brain selection has the full
  # training arc; default of 3 would discard the pre-peak epochs.
  retention_n_checkpoints: 40
  tensorboard: false
  wandb: false

regions:
  brain:
    source: latents_h5
  wt:
    source: derived_from_tumor_latent
    threshold: 0.5
  wt_dilated:
    source: derived_via_scipy_binary_dilation
    structure: ones_3x3x3
  bg:
    source: derived
  vessel:
    source: skipped
