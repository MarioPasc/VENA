# Picasso — S2 T-13 J1: v3a warm-start + 2-ch [TC,NETC] ControlNet, JOINT trunk, tc=1.
#
# J1 = equal-weight ceiling arm. Sibling of J0 differing in exactly TWO keys:
#   model.trunk.trainable   false -> true
#   run.tag
# so J0 -> J1 reads as the pure freeze -> joint trunk gain (same lr, same loss
# path, same data, same seed).
#
# ⚠ trainable-trunk warm-start is SINGLE-SHOT / not resume-safe: trunk_ema is
# built in setup() AFTER Lightning's checkpoint load, so it needs the
# trunk_ema_snapshot.pt sibling of ema_best.ckpt (verified present, 722 MB).
#
# WARM_START from v3a ema_best.ckpt (read-only, verified present on Picasso):
#   /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/vena_project/
#   2026-06-24_16-00-46_s1_v3a_concat_only_fft_ef000c9f/checkpoints/ema_best.ckpt
#
# Conditioning: mask-only ControlNet (no latents in conditioning_inputs).
# Two 1-channel specs [TC, NETC] → assembler mask-part total_channels == 2;
# hint-net conditioning_in_channels == 2. A single 2-ch spec would silently
# under-count total_channels — always use two 1-ch specs (A.8-§4).
#
# patience: 450 — the harder objective transiently raises train/total_epoch
# during the ControlNet warm-in phase; patience=250 risks a premature stop.
#
# base_img_size_numel: 129024 = 48×56×48 — this is the CORRECT served latent
# grid (verified 2026-07-22 against Picasso disk and the manifest producer).
#
# Submit via:
#   bash routines/fm/train/slurm/runs/launcher_picasso_s2_t13_j1.sh

run:
  stage: s1
  tag: s2_t13_j1_cn2ch_joint_tc1
  resume_from: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/vena_project/2026-06-24_16-00-46_s1_v3a_concat_only_fft_ef000c9f/checkpoints/ema_best.ckpt
  seed: 1337
  device: cuda
  precision: bf16-mixed
  full_determinism: false

data:
  corpus_registry: routines/fm/train/configs/corpus/corpus_picasso.json
  fold: 0
  batch_size: 4
  num_workers: 8
  pin_memory: true
  tau: 0.5
  augmentation_config_path: null
  preflight_decision_path: null
  dedup_decisions_path: /mnt/home/users/tic_163_uma/mpascual/fscratch/artifacts/preflights/cohort_dedup/LATEST/decision.json
  # Offline aug ON, matching the v3a warm-start source's own data regime, so
  # the S3 no-regression gate is not confounded by a data-regime change.
  # Requires masks/tumor_latent_soft in the *_latents_aug.h5 (task 19b).
  use_offline_augmented_data: true
  variant_weights:
    v0: 0.2
    v1: 0.2
    v2: 0.2
    v3: 0.2
    v4: 0.2
  mask_source: oracle_soft

model:
  trunk:
    checkpoint: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/NV-Generate-MR/models/diff_unet_3d_rflow-mr.pt
    arch_json: null
    # v3a channel layout: trunk in_channels widened 4→16 by expand_conv_in
    # (4 MAISI + 3×4 concat channels for [t1pre,t2,flair]). Preserved verbatim
    # from the v3a warm-start config so weight shapes match on load.
    arch_overrides:
      in_channels: 16
    class_token: 9
    spacing_mm: [1.0, 1.0, 1.0]
    trainable: true         # J1-J4 joint arm — trunk fine-tuned with the ControlNet
    regime: fft
    # input_concat is verbatim from v3a; keeps the trunk conv_in shape byte-identical
    # at warm-start so no architecture mismatch on ckpt load.
    input_concat:
      enabled: true
      cond_latents: [t1pre, t2, flair]
      cond_masks: []
      zero_init_new_channels: true
      ramp_steps: 0
      ramp_steepness: 10.0
  controlnet:
    enabled: true
    init_from_trunk: true   # copy trunk down+mid blocks into the CN encoder
    # Two 1-channel specs (not one 2-ch key) — assembler mask_channels=1 per
    # spec, total_channels=2. A single "mask:tc_netc:identity" would silently
    # under-count to 1 and build the hint-net with wrong in_channels (A.8-§4).
    conditioning_inputs:
      - mask:tc_soft:identity
      - mask:netc_soft:identity
    arch_overrides: {}
    perturb_keys: []
    output_scale_ramp:
      enabled: true
      ramp_steps: 5000
      steepness: 10.0
  vae_checkpoint: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/NV-Generate-MR/models/autoencoder_v2.pt

loss:
  cfm:
    weight: 1.0
    # reduction: none is REQUIRED whenever region_weights is enabled (the loss
    # needs the per-voxel tensor). All five matrix arms run this same path so
    # J0 and J1-J4 differ only in trunk policy and the tc weight — never in
    # which loss code path executes.
    reduction: none
    norm: l1
    # Brain/TC partition: {BG, Brain = in_brain & ~TC, TC}, TC from m_tc_soft
    # (mask channel 0 = tumour core, edema EXCLUDED; edema falls in Brain and
    # is reconstructed from the inputs, which is intended).
    # {brain: 1, tc: 1} is NUMERICALLY IDENTICAL to plain L1-mean (verified
    # max-abs residual 0.0), so J0/J1 carry the mechanism at zero numerical cost.
    region_weights:
      enabled: true
      brain: 1.0
      tc: 1.0
      threshold: 0.5

rflow:
  num_train_timesteps: 1000
  use_discrete_timesteps: true
  sample_method: logit-normal
  use_timestep_transform: true
  # 129024 = 48×56×48 (CORRECT — verified 2026-07-22; no grid mismatch)
  base_img_size_numel: 129024

optim:
  # 5e-5 = half v3a's 1e-4. This is a warm-start fine-tune of a CONVERGED
  # trunk plus a fresh ControlNet, so the trunk must not drift far. The SAME
  # lr is used by all five arms (the optimiser has a single param group in the
  # fft regime — there is no per-group lr), which is what makes J0 -> J1 a
  # clean one-variable read of the freeze -> joint gain.
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-2
  warmup_steps: 1000
  scheduler: cosine

ema:
  decay: 0.9999
  update_after_step: 0
  update_every: 1
  inv_gamma: 10.0
  power: 1.0
  min_value: 0.0

training:
  total_steps: 400000
  max_epochs: 10000
  batch_size: 4
  grad_accum: 2
  checkpoint_every_epochs: 25
  log_train_every_steps: 100
  gradient_clip_val: 1.0
  # 450 — harder objective transiently raises train/total_epoch during the
  # ControlNet ramp-in; patience=250 risks a premature stop.
  patience: 450

validation:
  every_epochs: 0
  per_epoch_nfe: 5
  full_sweep_every_epochs: 999999
  sweep_nfes: [1, 2, 5, 10, 20]
  qualitative_every_epochs: 999999
  image_metrics: false

exhaustive_val:
  enabled: true
  every_epochs: 25
  n_patients: 60
  nfe_levels: [1, 2, 5, 10, 20]
  integrator: euler
  corpus_registry: routines/fm/train/configs/corpus/corpus_picasso.json
  device: cuda:1
  block_until_complete: false
  figure_top_k: 5

output:
  experiments_root: /mnt/home/users/tic_163_uma/mpascual/execs/vena/experiments
  retention_n_checkpoints: 3
  tensorboard: false
  wandb: false

regions:
  brain:
    source: latents_h5
  wt:
    source: derived_from_tumor_latent
    threshold: 0.5
  wt_dilated:
    source: derived_via_scipy_binary_dilation
    structure: ones_3x3x3
  bg:
    source: derived
  vessel:
    source: skipped
